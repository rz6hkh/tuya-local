name: CO detector
products:
  - id: 150lof4of8h1ppj5
    model: PTH-9DW
entities:
  - entity: sensor
    class: carbon_monoxide
    dps:
      - id: 35
        type: integer
        name: sensor
        unit: ppm
        class: measurement
  - entity: sensor
    class: temperature
    dps:
      - id: 8
        type: integer
        name: sensor
        class: measurement
      - id: 101
        type: string
        optional: true
        name: unit
        mapping:
          - dps_val: f
            value: F
          - value: C
  - entity: sensor
    class: humidity
    dps:
      - id: 9
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 101
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 23
        type: boolean
        name: switch
